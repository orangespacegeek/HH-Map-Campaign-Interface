<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sunset Heresy – Forces</title>
  <style>
    :root {
      --bg: #0a0a12; --panel: #12121e; --panel-2: #1a1a28; --border: #3a3a55;
      --text: #e8e0c8; --muted: #9a9080; --accent: #f0c040;
      --loyal: #3b82f6; --loyal-fill: #1e3a5f; --traitor: #ef4444; --traitor-fill: #5c1a1a;
      --blackshield: #a78bfa; --blackshield-fill: #2e1065; --success: #22c55e; --warn: #eab308;
      --safe-bottom: env(safe-area-inset-bottom, 0px);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { min-height: 100%; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; background: var(--bg); color: var(--text); }
    body { display: flex; flex-direction: column; min-height: 100vh; }

    .site-header { flex-shrink: 0; background: #0e0e18; border-bottom: 1px solid var(--border); position: sticky; top: 0; z-index: 30; }
    .site-header-inner { display: flex; align-items: center; gap: 0.65rem; padding: 0.5rem 0.85rem; max-width: 1100px; margin: 0 auto; }
    .site-header img { height: 36px; width: auto; }
    .site-header .titles { flex: 1; min-width: 0; }
    .site-header h1 { font-size: 1.05rem; font-weight: 600; color: var(--accent); letter-spacing: 0.02em; line-height: 1.2; }
    .site-header .sub { font-size: 0.7rem; color: var(--muted); }
    .site-nav { display: flex; gap: 0.15rem; overflow-x: auto; padding: 0 0.5rem 0.45rem; max-width: 1100px; margin: 0 auto; scrollbar-width: none; }
    .site-nav::-webkit-scrollbar { display: none; }
    .site-nav a { flex-shrink: 0; padding: 0.35rem 0.7rem; border-radius: 6px; font-size: 0.78rem; font-weight: 500; color: var(--muted); text-decoration: none; white-space: nowrap; }
    .site-nav a:hover { color: var(--text); background: var(--panel-2); }
    .site-nav a.active { color: var(--accent); background: rgba(240, 192, 64, 0.12); }

    main { flex: 1; padding: 1rem; max-width: 1100px; width: 100%; margin: 0 auto; padding-bottom: calc(1.5rem + var(--safe-bottom)); }
    .toolbar { display: flex; flex-wrap: wrap; gap: 0.6rem; margin-bottom: 1rem; align-items: center; }
    .search { flex: 1; min-width: 160px; background: var(--panel); border: 1px solid var(--border); color: var(--text); padding: 0.55rem 0.75rem; border-radius: 8px; font-size: 0.9rem; }
    .search:focus { outline: none; border-color: var(--accent); }
    .filters { display: flex; flex-wrap: wrap; gap: 0.4rem; }
    .chip { padding: 0.35rem 0.7rem; border-radius: 999px; border: 1px solid var(--border); background: var(--panel); color: var(--muted); font-size: 0.75rem; cursor: pointer; user-select: none; }
    .chip.active { background: var(--panel-2); color: var(--text); border-color: var(--accent); }
    .chip.loyal.active { border-color: var(--loyal); color: var(--loyal); }
    .chip.traitor.active { border-color: var(--traitor); color: var(--traitor); }

    button { appearance: none; border: 1px solid var(--border); background: var(--panel-2); color: var(--text); padding: 0.5rem 0.9rem; border-radius: 8px; font-size: 0.85rem; font-weight: 500; cursor: pointer; }
    button:hover { border-color: var(--accent); }
    button.primary { background: var(--accent); color: #0a0a12; border-color: var(--accent); font-weight: 600; }
    button.danger { border-color: #ef4444; color: #ef4444; }
    button.ghost { background: transparent; }
    button:disabled { opacity: 0.45; cursor: not-allowed; }

    .action-panel {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 0.85rem 1rem;
      margin-bottom: 1rem;
    }
    .action-panel-head {
      display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 0.5rem;
      margin-bottom: 0.4rem;
    }
    .action-panel-head strong { color: var(--accent); font-size: 0.95rem; }
    .action-meta { margin-left: 0.5rem; font-size: 0.78rem; color: var(--muted); }
    .action-remain {
      font-size: 0.85rem; font-weight: 600; color: var(--accent);
      border: 1px solid rgba(240,192,64,0.35); padding: 0.25rem 0.6rem; border-radius: 999px;
    }
    .action-hint { font-size: 0.78rem; color: var(--muted); margin-bottom: 0.65rem; }
    .action-forms { display: flex; flex-direction: column; gap: 0.55rem; }
    .action-row {
      display: flex; flex-wrap: wrap; gap: 0.4rem; align-items: center;
      padding: 0.45rem 0; border-top: 1px solid #1f1f30;
    }
    .action-row label {
      min-width: 11rem; font-size: 0.78rem; color: var(--muted); font-weight: 500;
    }
    .action-row select, .action-row input {
      background: var(--panel-2); border: 1px solid var(--border); color: var(--text);
      padding: 0.4rem 0.55rem; border-radius: 6px; font-size: 0.82rem; min-width: 8rem;
    }
    .action-row input { flex: 1; min-width: 10rem; }

    .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(100px, 1fr)); gap: 0.6rem; margin-bottom: 1rem; }
    .stat { background: var(--panel); border: 1px solid var(--border); border-radius: 10px; padding: 0.65rem; text-align: center; }
    .stat .num { font-size: 1.3rem; font-weight: 700; color: var(--accent); }
    .stat .label { font-size: 0.68rem; color: var(--muted); text-transform: uppercase; letter-spacing: 0.04em; }

    .table-wrap { background: var(--panel); border: 1px solid var(--border); border-radius: 12px; overflow: hidden; }
    table { width: 100%; border-collapse: collapse; font-size: 0.88rem; }
    th { text-align: left; padding: 0.65rem 0.85rem; background: #0e0e18; color: var(--muted); font-weight: 600; font-size: 0.72rem; text-transform: uppercase; letter-spacing: 0.04em; border-bottom: 1px solid var(--border); white-space: nowrap; }
    td { padding: 0.7rem 0.85rem; border-bottom: 1px solid #1f1f30; vertical-align: middle; }
    tr:last-child td { border-bottom: none; }
    tr:hover td { background: rgba(255,255,255,0.02); }

    .badge { display: inline-block; padding: 0.18rem 0.5rem; border-radius: 4px; font-size: 0.68rem; font-weight: 600; }
    .badge.loyalist { background: var(--loyal-fill); color: var(--loyal); }
    .badge.traitor { background: var(--traitor-fill); color: var(--traitor); }
    .badge.blackshield { background: var(--blackshield-fill); color: var(--blackshield); }
    .badge.active { background: #14532d; color: var(--success); }
    .badge.destroyed { background: #3f3f46; color: #a1a1aa; }

    .str-pips { display: inline-flex; gap: 3px; vertical-align: middle; }
    .str-pips i { width: 8px; height: 8px; border-radius: 50%; background: #3a3a55; }
    .str-pips i.on { background: var(--accent); }

    .overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.55); z-index: 40; opacity: 0; pointer-events: none; transition: opacity 0.2s; }
    .overlay.open { opacity: 1; pointer-events: auto; }
    .drawer { position: fixed; top: 0; right: 0; width: min(420px, 100%); height: 100%; background: var(--panel); border-left: 1px solid var(--border); z-index: 50; transform: translateX(100%); transition: transform 0.28s ease; display: flex; flex-direction: column; }
    .drawer.open { transform: translateX(0); }
    .drawer-header { display: flex; align-items: center; gap: 0.6rem; padding: 0.85rem 1rem; border-bottom: 1px solid var(--border); }
    .drawer-header h2 { font-size: 1.05rem; color: var(--accent); flex: 1; }
    .drawer-body { flex: 1; overflow-y: auto; padding: 1rem; }
    .drawer-footer { padding: 0.85rem 1rem calc(0.85rem + var(--safe-bottom)); border-top: 1px solid var(--border); display: flex; gap: 0.5rem; }
    .drawer-footer button { flex: 1; }
    .form-group { margin-bottom: 0.9rem; }
    .form-group label { display: block; font-size: 0.72rem; color: var(--muted); text-transform: uppercase; letter-spacing: 0.04em; margin-bottom: 0.3rem; }
    .form-group input, .form-group select, .form-group textarea { width: 100%; background: var(--panel-2); border: 1px solid var(--border); color: var(--text); padding: 0.55rem 0.7rem; border-radius: 8px; font-size: 0.9rem; font-family: inherit; }
    .form-group input:focus, .form-group select:focus, .form-group textarea:focus { outline: none; border-color: var(--accent); }
    .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 0.7rem; }
    .toast { position: fixed; bottom: calc(1.2rem + var(--safe-bottom)); left: 50%; transform: translateX(-50%) translateY(120%); background: var(--panel-2); border: 1px solid var(--accent); color: var(--text); padding: 0.65rem 1.1rem; border-radius: 8px; font-size: 0.85rem; z-index: 60; transition: transform 0.25s; }
    .toast.show { transform: translateX(-50%) translateY(0); }
    .empty { text-align: center; padding: 2rem; color: var(--muted); }
    @media (max-width: 640px) { th.hide-sm, td.hide-sm { display: none; } .form-row { grid-template-columns: 1fr; } }
  </style>
</head>
<body>
  <header class="site-header">
    <div class="site-header-inner">
      <img src="Sunset Heresy-ff-02.png" alt="Sunset Heresy" />
      <div class="titles">
        <h1>Forces</h1>
        <div class="sub">Sunset Heresy · Army tokens</div>
      </div>
      <button type="button" class="primary" id="btn-add" data-role="campaign_admin player" hidden>+ Force</button>
    </div>
    <nav class="site-nav">
      <a href="index.html">Dashboard</a>
      <a href="campaign_map.html">Map</a>
      <a href="player_admin.html" data-role="campaign_admin">Players</a>
      <a href="forces.html" class="active">Forces</a>
      <a href="systems.html">Systems</a>
      <a href="games.html">Battles</a>
      <a href="rules.html">Rules</a>
      <span id="nav-auth"></span>
    </nav>
  </header>

  <main>
    <div class="stats" id="stats"></div>
    <section class="action-panel" id="action-panel" hidden>
      <div class="action-panel-head">
        <div>
          <strong>Campaign actions</strong>
          <span class="action-meta" id="action-meta">—</span>
        </div>
        <div class="action-remain" id="action-remain">—</div>
      </div>
      <p class="action-hint" id="action-hint">Log in as a player during Logistics or Movement to issue orders.</p>
      <div class="action-forms" id="action-forms" hidden>
        <div class="action-row" data-phase="Logistics">
          <label>Reinforce (1 action)</label>
          <select id="act-reinforce-force"></select>
          <button type="button" id="btn-reinforce">Reinforce +1 strength</button>
        </div>
        <div class="action-row" data-phase="Logistics">
          <label>Fortify (1 action)</label>
          <select id="act-fortify-sys"></select>
          <button type="button" id="btn-fortify">Fortify system</button>
        </div>
        <div class="action-row" data-phase="Logistics">
          <label>Generate Force (2 actions)</label>
          <select id="act-generate-sys"></select>
          <input id="act-generate-name" placeholder="Force name (optional)" maxlength="80" />
          <button type="button" id="btn-generate">Raise force</button>
        </div>
        <div class="action-row" data-phase="Movement">
          <label>Move (1 action)</label>
          <select id="act-move-force"></select>
          <select id="act-move-dest"></select>
          <button type="button" id="btn-move">Order move</button>
          <button type="button" class="ghost" id="btn-hold">Hold (clear)</button>
        </div>
      </div>
    </section>
    <div class="toolbar">
      <input type="search" class="search" id="search" placeholder="Search force, warlord, legion…" />
      <div class="filters" id="filters">
        <span class="chip active" data-filter="all">All</span>
        <span class="chip" data-filter="active">Active</span>
        <span class="chip loyal" data-filter="Loyalist">Loyalist</span>
        <span class="chip traitor" data-filter="Traitor">Traitor</span>
      </div>
    </div>
    <div class="table-wrap">
      <table>
        <thead>
          <tr>
            <th>ID</th>
            <th>Force</th>
            <th class="hide-sm">Owner</th>
            <th>Allegiance</th>
            <th>Strength</th>
            <th class="hide-sm">Location</th>
            <th>Status</th>
            <th></th>
          </tr>
        </thead>
        <tbody id="tbody"></tbody>
      </table>
      <div class="empty" id="empty" hidden>No forces match.</div>
    </div>
  </main>

  <div class="overlay" id="overlay"></div>
  <aside class="drawer" id="drawer">
    <div class="drawer-header">
      <h2 id="drawer-title">Add Force</h2>
      <button type="button" class="ghost" id="btn-close">✕</button>
    </div>
    <div class="drawer-body">
      <form id="form">
        <input type="hidden" id="f-id" />
        <div class="form-group">
          <label for="f-name">Force Name *</label>
          <input id="f-name" required maxlength="100" placeholder="14th Grand Battalion" />
        </div>
        <div class="form-row">
          <div class="form-group">
            <label for="f-player">Owner *</label>
            <select id="f-player" required></select>
          </div>
          <div class="form-group">
            <label for="f-system">Game System *</label>
            <select id="f-system" required>
              <option value="HH">HH (Age of Darkness)</option>
              <option value="AT">Adeptus Titanicus</option>
              <option value="AI">Aeronautica Imperialis</option>
              <option value="LI">Legions Imperialis</option>
            </select>
          </div>
        </div>
        <div class="form-row">
          <div class="form-group">
            <label for="f-allegiance">Allegiance *</label>
            <select id="f-allegiance" required>
              <option value="Loyalist">Loyalist</option>
              <option value="Traitor">Traitor</option>
              <option value="Blackshield">Blackshield</option>
            </select>
          </div>
          <div class="form-group">
            <label for="f-type">Force Type</label>
            <input id="f-type" placeholder="Legion" />
          </div>
        </div>
        <div class="form-group">
          <label for="f-legion">Legion / Faction</label>
          <input id="f-legion" placeholder="IV Iron Warriors" />
        </div>
        <div class="form-group">
          <label for="f-warlord">Warlord</label>
          <input id="f-warlord" placeholder="Warsmith Voss" />
        </div>
        <div class="form-row">
          <div class="form-group">
            <label for="f-strength">Strength (1–3)</label>
            <select id="f-strength">
              <option value="3">3</option>
              <option value="2">2</option>
              <option value="1">1</option>
              <option value="0">0 (destroyed)</option>
            </select>
          </div>
          <div class="form-group">
            <label for="f-status">Status</label>
            <select id="f-status">
              <option value="active">Active</option>
              <option value="destroyed">Destroyed</option>
            </select>
          </div>
        </div>
        <div class="form-row">
          <div class="form-group">
            <label for="f-sys">Current System</label>
            <select id="f-sys"><option value="">—</option></select>
          </div>
          <div class="form-group">
            <label for="f-points">Points</label>
            <input type="number" id="f-points" min="0" step="500" placeholder="3000" />
          </div>
        </div>
        <div class="form-group">
          <label for="f-notes">Notes</label>
          <textarea id="f-notes" rows="3"></textarea>
        </div>
      </form>
    </div>
    <div class="drawer-footer">
      <button type="button" class="danger ghost" id="btn-delete" hidden>Delete</button>
      <button type="button" class="primary" id="btn-save">Save</button>
    </div>
  </aside>
  <div class="toast" id="toast"></div>

  <script src="js/api.js"></script>
  <script>
    const SYSTEMS = [
      { id: 1, name: "Port Maw" }, { id: 2, name: "Aeolus" }, { id: 3, name: "Marinas" },
      { id: 4, name: "Mezoa" }, { id: 5, name: "Electris" }, { id: 6, name: "Acre" },
      { id: 7, name: "Bretz" }, { id: 8, name: "TR/0524" }, { id: 9, name: "Kueghan" },
      { id: 10, name: "Ortho" }, { id: 11, name: "Lethe" }, { id: 12, name: "Kiliman IV" },
      { id: 13, name: "Walpurgia" }
    ];

    let forces = [];
    let players = [];
    let filter = "all", searchQ = "", editingId = null;

    const tbody = document.getElementById("tbody");
    const empty = document.getElementById("empty");
    const overlay = document.getElementById("overlay");
    const drawer = document.getElementById("drawer");
    const toast = document.getElementById("toast");

    const playerSel = document.getElementById("f-player");
    const sysSel = document.getElementById("f-sys");
    SYSTEMS.forEach(s => {
      const o = document.createElement("option");
      o.value = s.id; o.textContent = s.name;
      sysSel.appendChild(o);
    });

    async function reload() {
      forces = await SH.list("forces");
      players = await SH.list("players");
      const cur = playerSel.value;
      playerSel.innerHTML = "";
      players.forEach(p => {
        const o = document.createElement("option");
        o.value = p.player_id;
        o.textContent = p.display_name || p.player_name;
        playerSel.appendChild(o);
      });
      if (cur) playerSel.value = cur;
      render();
      let badge = document.getElementById("mode-badge");
      if (!badge) {
        badge = document.createElement("span");
        badge.id = "mode-badge";
        document.querySelector(".site-header-inner").appendChild(badge);
      }
      badge.innerHTML = SH.statusBadgeHtml();
      try { await refreshActionPanel(); } catch (_) {}
    }

    function playerName(f) {
      if (f.owner_display) return f.owner_display;
      const p = players.find(x => x.player_id === Number(f.player_id));
      return p ? (p.display_name || p.player_name || "Unknown") : "Unknown";
    }
    function systemName(id) {
      if (!id) return "—";
      const s = SYSTEMS.find(x => x.id === Number(id));
      return s ? s.name : `#${id}`;
    }
    function nextId() { return forces.reduce((m, f) => Math.max(m, f.force_id), 0) + 1; }
    function esc(s) { return String(s ?? "").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }
    function showToast(msg) {
      toast.textContent = msg; toast.classList.add("show");
      clearTimeout(showToast._t); showToast._t = setTimeout(() => toast.classList.remove("show"), 2200);
    }
    function strengthPips(n) {
      let h = "";
      for (let i = 1; i <= 3; i++) h += `<i class="${i <= n ? "on" : ""}"></i>`;
      return `<span class="str-pips">${h}</span>`;
    }

    function renderStats() {
      const active = forces.filter(f => f.status === "active").length;
      const loyal = forces.filter(f => f.allegiance === "Loyalist").length;
      const traitor = forces.filter(f => f.allegiance === "Traitor").length;
      document.getElementById("stats").innerHTML = `
        <div class="stat"><div class="num">${forces.length}</div><div class="label">Forces</div></div>
        <div class="stat"><div class="num">${active}</div><div class="label">Active</div></div>
        <div class="stat"><div class="num" style="color:var(--loyal)">${loyal}</div><div class="label">Loyalist</div></div>
        <div class="stat"><div class="num" style="color:var(--traitor)">${traitor}</div><div class="label">Traitor</div></div>
      `;
    }

    function filtered() {
      let list = forces.slice();
      if (filter === "active") list = list.filter(f => f.status === "active");
      else if (filter === "Loyalist" || filter === "Traitor") list = list.filter(f => f.allegiance === filter);
      if (searchQ) {
        const q = searchQ.toLowerCase();
        list = list.filter(f =>
          (f.force_name || "").toLowerCase().includes(q) ||
          (f.warlord_name || "").toLowerCase().includes(q) ||
          (f.legion || "").toLowerCase().includes(q)
        );
      }
      return list.sort((a, b) => a.force_id - b.force_id);
    }

    function render() {
      const list = filtered();
      tbody.innerHTML = "";
      empty.hidden = list.length > 0;
      list.forEach(f => {
        const tr = document.createElement("tr");
        const all = (f.allegiance || "").toLowerCase();
        tr.innerHTML = `
          <td>${f.force_id}</td>
          <td>
            <strong>${esc(f.force_name)}</strong>
            <div style="font-size:0.72rem;color:var(--muted)">${esc(f.legion || f.force_type || "")}${f.warlord_name ? " · " + esc(f.warlord_name) : ""}</div>
          </td>
          <td class="hide-sm">${esc(playerName(f))}</td>
          <td><span class="badge ${all}">${esc(f.allegiance)}</span></td>
          <td>${strengthPips(Number(f.strength) || 0)} <span style="font-size:0.75rem;color:var(--muted);margin-left:0.25rem">${f.strength ?? 0}</span></td>
          <td class="hide-sm">${esc(systemName(f.sys_id))}${f.dest_sys_id ? ` <span style="color:var(--accent);font-size:0.72rem">→ ${esc(systemName(f.dest_sys_id))}</span>` : ""}</td>
          <td><span class="badge ${f.status}">${esc(f.status)}</span></td>
          <td>${SH.canEditForce(f) ? `<button type="button" data-edit="${f.force_id}">Edit</button>` : ""}</td>
        `;
        tbody.appendChild(tr);
      });
      renderStats();
    }

    function openDrawer(force) {
      editingId = force ? force.force_id : null;
      document.getElementById("drawer-title").textContent = force ? `Edit Force #${force.force_id}` : "Add Force";
      document.getElementById("f-id").value = force ? force.force_id : "";
      document.getElementById("f-name").value = force ? force.force_name : "";
      document.getElementById("f-player").value = force ? force.player_id : (players[0]?.player_id || "");
      document.getElementById("f-system").value = force ? force.game_system : "HH";
      document.getElementById("f-allegiance").value = force ? force.allegiance : "Loyalist";
      document.getElementById("f-type").value = force ? (force.force_type || "") : "";
      document.getElementById("f-legion").value = force ? (force.legion || "") : "";
      document.getElementById("f-warlord").value = force ? (force.warlord_name || "") : "";
      document.getElementById("f-strength").value = force ? String(force.strength ?? 3) : "3";
      document.getElementById("f-status").value = force ? force.status : "active";
      document.getElementById("f-sys").value = force && force.sys_id ? force.sys_id : "";
      document.getElementById("f-points").value = force ? (force.points || "") : "";
      document.getElementById("f-notes").value = force ? (force.notes || "") : "";
      document.getElementById("btn-delete").hidden = !force;
      overlay.classList.add("open");
      drawer.classList.add("open");
    }

    function closeDrawer() {
      overlay.classList.remove("open");
      drawer.classList.remove("open");
      editingId = null;
    }

    async function save() {
      if (!document.getElementById("form").reportValidity()) return;
      const idVal = document.getElementById("f-id").value;
      const payload = {
        force_id: idVal ? Number(idVal) : undefined,
        player_id: Number(document.getElementById("f-player").value),
        force_name: document.getElementById("f-name").value.trim(),
        game_system: document.getElementById("f-system").value,
        force_type: document.getElementById("f-type").value.trim() || null,
        allegiance: document.getElementById("f-allegiance").value,
        legion: document.getElementById("f-legion").value.trim() || null,
        warlord_name: document.getElementById("f-warlord").value.trim() || null,
        strength: Number(document.getElementById("f-strength").value),
        status: document.getElementById("f-status").value,
        sys_id: document.getElementById("f-sys").value ? Number(document.getElementById("f-sys").value) : null,
        points: document.getElementById("f-points").value ? Number(document.getElementById("f-points").value) : null,
        notes: document.getElementById("f-notes").value.trim() || null
      };
      try {
        await SH.save("forces", payload);
        await reload();
        closeDrawer();
        showToast(idVal ? "Force updated" : "Force added");
      } catch (err) {
        showToast("Save failed: " + err.message);
      }
    }

    async function del() {
      if (!editingId || !confirm(`Delete force #${editingId}?`)) return;
      try {
        await SH.remove("forces", editingId);
        await reload();
        closeDrawer();
        showToast("Force deleted");
      } catch (err) {
        showToast("Delete failed: " + err.message);
      }
    }

    document.getElementById("btn-add").addEventListener("click", () => openDrawer(null));
    document.getElementById("btn-close").addEventListener("click", closeDrawer);
    overlay.addEventListener("click", closeDrawer);
    document.getElementById("btn-save").addEventListener("click", save);
    document.getElementById("btn-delete").addEventListener("click", del);
    tbody.addEventListener("click", e => {
      const btn = e.target.closest("[data-edit]");
      if (!btn) return;
      const f = forces.find(x => x.force_id === Number(btn.dataset.edit));
      if (f) openDrawer(f);
    });
    document.getElementById("search").addEventListener("input", e => { searchQ = e.target.value.trim(); render(); });
    document.getElementById("filters").addEventListener("click", e => {
      const chip = e.target.closest(".chip");
      if (!chip) return;
      document.querySelectorAll(".chip").forEach(c => c.classList.remove("active"));
      chip.classList.add("active");
      filter = chip.dataset.filter;
      render();
    });
    document.addEventListener("keydown", e => { if (e.key === "Escape") closeDrawer(); });

    let systemsLive = [];
    let actionStatus = null;

    function parseLinks(sys) {
      if (!sys || sys.sys_links == null || sys.sys_links === "") return [];
      return String(sys.sys_links).split(/[,;\s]+/).map(s => Number(s.trim())).filter(n => n > 0);
    }

    function fillSelect(sel, items, valueKey, labelFn, emptyLabel) {
      const prev = sel.value;
      sel.innerHTML = "";
      if (emptyLabel) {
        const o = document.createElement("option");
        o.value = ""; o.textContent = emptyLabel;
        sel.appendChild(o);
      }
      items.forEach(it => {
        const o = document.createElement("option");
        o.value = it[valueKey];
        o.textContent = labelFn(it);
        sel.appendChild(o);
      });
      if (prev && [...sel.options].some(o => o.value === prev)) sel.value = prev;
    }

    function myForces() {
      if (SH.role === "campaign_admin") return forces.filter(f => f.status === "active");
      const pid = SH.user && SH.user.player_id;
      return forces.filter(f => f.status === "active" && Number(f.player_id) === Number(pid));
    }

    function refreshMoveDests() {
      const forceId = Number(document.getElementById("act-move-force").value);
      const force = forces.find(f => Number(f.force_id) === forceId);
      const destSel = document.getElementById("act-move-dest");
      if (!force) {
        fillSelect(destSel, [], "sys_id", s => s.sys_name, "Select force first");
        return;
      }
      const from = systemsLive.find(s => Number(s.sys_id) === Number(force.sys_id));
      const links = parseLinks(from);
      const opts = systemsLive.filter(s => links.includes(Number(s.sys_id)));
      fillSelect(destSel, opts, "sys_id", s => s.sys_name, opts.length ? "Choose destination" : "No linked systems");
    }

    async function refreshActionPanel() {
      const panel = document.getElementById("action-panel");
      const forms = document.getElementById("action-forms");
      const metaEl = document.getElementById("action-meta");
      const remainEl = document.getElementById("action-remain");
      const hint = document.getElementById("action-hint");

      try {
        systemsLive = await SH.list("systems");
        actionStatus = await SH.actionsStatus();
      } catch (e) {
        panel.hidden = true;
        return;
      }

      const role = SH.role;
      const phase = actionStatus.phase || "—";
      const turn = actionStatus.turn ?? "—";
      panel.hidden = false;
      metaEl.textContent = `Turn ${turn} · ${phase}`;

      if (role !== "player" && role !== "campaign_admin") {
        forms.hidden = true;
        remainEl.textContent = "Log in";
        hint.textContent = "Log in as a player (or campaign admin) to issue Move, Reinforce, Fortify, or Generate Force orders.";
        return;
      }

      const remaining = actionStatus.actions_remaining;
      remainEl.textContent =
        remaining == null
          ? "Admin"
          : `${remaining} action${remaining === 1 ? "" : "s"} left`;

      forms.hidden = false;
      document.querySelectorAll(".action-row").forEach(row => {
        const need = row.getAttribute("data-phase");
        row.style.display = need === phase ? "flex" : "none";
      });

      if (phase === "Logistics") {
        hint.textContent = "Logistics: Reinforce (1), Fortify (1), or Generate Force (2). Max 2 actions per turn.";
      } else if (phase === "Movement") {
        hint.textContent = "Movement: order a force to a linked system (1 action). Hold is free and clears a pending move.";
      } else {
        hint.textContent = "Battles phase: no logistics or movement orders. Resolve games, then advance the turn.";
        forms.hidden = true;
      }

      const mine = myForces();
      fillSelect(
        document.getElementById("act-reinforce-force"),
        mine.filter(f => (Number(f.strength) || 0) < 3),
        "force_id",
        f => `#${f.force_id} ${f.force_name} (str ${f.strength}) @ ${systemName(f.sys_id)}`,
        "Select force"
      );
      fillSelect(
        document.getElementById("act-move-force"),
        mine,
        "force_id",
        f => `#${f.force_id} ${f.force_name} @ ${systemName(f.sys_id)}${f.dest_sys_id ? " → " + systemName(f.dest_sys_id) : ""}`,
        "Select force"
      );
      fillSelect(
        document.getElementById("act-fortify-sys"),
        systemsLive,
        "sys_id",
        s => `${s.sys_name} (${s.sys_controller || "?"}, dur ${s.sys_durability != null ? s.sys_durability : 5})`,
        "Select system"
      );
      fillSelect(
        document.getElementById("act-generate-sys"),
        systemsLive,
        "sys_id",
        s => `${s.sys_name} (${s.sys_controller || "?"})`,
        "Select system"
      );
      refreshMoveDests();
    }

    document.getElementById("act-move-force").addEventListener("change", refreshMoveDests);

    async function runAction(fn) {
      try {
        const result = await fn();
        showToast(result.message || "Done");
        await reload();
        await refreshActionPanel();
      } catch (err) {
        showToast(err.message || "Action failed");
      }
    }

    document.getElementById("btn-reinforce").addEventListener("click", () => {
      const id = Number(document.getElementById("act-reinforce-force").value);
      if (!id) return showToast("Select a force");
      runAction(() => SH.reinforceForce(id));
    });
    document.getElementById("btn-fortify").addEventListener("click", () => {
      const id = Number(document.getElementById("act-fortify-sys").value);
      if (!id) return showToast("Select a system");
      runAction(() => SH.fortifySystem(id));
    });
    document.getElementById("btn-generate").addEventListener("click", () => {
      const id = Number(document.getElementById("act-generate-sys").value);
      if (!id) return showToast("Select a system");
      const name = document.getElementById("act-generate-name").value.trim();
      runAction(() => SH.generateForce(id, name ? { force_name: name } : {}));
    });
    document.getElementById("btn-move").addEventListener("click", () => {
      const fid = Number(document.getElementById("act-move-force").value);
      const dest = Number(document.getElementById("act-move-dest").value);
      if (!fid || !dest) return showToast("Select force and destination");
      runAction(() => SH.moveForce(fid, dest));
    });
    document.getElementById("btn-hold").addEventListener("click", () => {
      const fid = Number(document.getElementById("act-move-force").value);
      if (!fid) return showToast("Select a force");
      runAction(() => SH.holdForce(fid));
    });

    (async () => {
      try {
        await SH.probe();
        await SH.applyNavPermissions();
        const addBtn = document.getElementById("btn-add");
        // Only campaign admin creates forces outside the Generate action
        if (addBtn) addBtn.hidden = SH.role !== "campaign_admin";
        await reload();
      } catch (err) {
        console.error(err);
        showToast("Could not load forces");
      }
    })();
  </script>
</body>
</html>
