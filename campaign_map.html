<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Sunset Heresy – Port Maw Sub-Sector</title>
  <style>
    :root {
      --bg: #0a0a12;
      --panel: #12121e;
      --border: #3a3a55;
      --text: #e8e0c8;
      --muted: #9a9080;
      --accent: #f0c040;
      /* Stronger, more distinct controller colours */
      --loyal: #3b82f6;       /* bright blue */
      --loyal-fill: #1e3a5f;
      --traitor: #ef4444;     /* strong red */
      --traitor-fill: #5c1a1a;
      --contested: #eab308;   /* clear amber/gold */
      --contested-fill: #4a3b0a;
      --unaligned: #94a3b8;   /* cool slate grey */
      --unaligned-fill: #1e293b;
      --node-fill: #1a1a28;
      --node-stroke: #d0c8a0;
      --safe-bottom: env(safe-area-inset-bottom, 0px);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      height: 100%;
      overflow: hidden;
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
      background: var(--bg);
      color: var(--text);
      -webkit-tap-highlight-color: transparent;
    }
    body {
      display: flex;
      flex-direction: column;
    }

    header {
      flex-shrink: 0;
      background: #0e0e18;
      border-bottom: 1px solid var(--border);
      z-index: 20;
    }
    header .header-row {
      display: flex;
      align-items: center;
      gap: 0.6rem;
      padding: 0.45rem 0.75rem 0.25rem;
    }
    header img { height: 36px; width: auto; flex-shrink: 0; }
    header .titles { flex: 1; min-width: 0; }
    header h1 {
      font-size: 1.05rem;
      font-weight: 600;
      letter-spacing: 0.03em;
      color: var(--accent);
      line-height: 1.2;
    }
    header .sub {
      font-size: 0.7rem;
      color: var(--muted);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .site-nav {
      display: flex;
      gap: 0.1rem;
      overflow-x: auto;
      padding: 0 0.5rem 0.4rem;
      scrollbar-width: none;
      -webkit-overflow-scrolling: touch;
    }
    .site-nav::-webkit-scrollbar { display: none; }
    .site-nav a {
      flex-shrink: 0;
      padding: 0.3rem 0.6rem;
      border-radius: 6px;
      font-size: 0.72rem;
      font-weight: 500;
      color: var(--muted);
      text-decoration: none;
      white-space: nowrap;
    }
    .site-nav a:hover { color: var(--text); background: #1a1a28; }
    .site-nav a.active {
      color: var(--accent);
      background: rgba(240, 192, 64, 0.12);
    }

    /* Control status bar */
    .status-bar {
      flex-shrink: 0;
      background: #0e0e18;
      border-bottom: 1px solid var(--border);
      padding: 0.45rem 0.75rem 0.55rem;
      z-index: 15;
    }
    .status-bar .status-labels {
      display: flex;
      justify-content: space-between;
      font-size: 0.68rem;
      margin-bottom: 0.3rem;
      gap: 0.4rem;
      flex-wrap: wrap;
    }
    .status-bar .status-labels span {
      display: flex;
      align-items: center;
      gap: 0.25rem;
      white-space: nowrap;
    }
    .status-bar .status-labels .pct {
      font-weight: 700;
      font-variant-numeric: tabular-nums;
    }
    .status-bar .status-labels .loyalist { color: #93c5fd; }
    .status-bar .status-labels .traitor { color: #fca5a5; }
    .status-bar .status-labels .contested { color: #fde68a; }
    .status-bar .status-labels .unaligned { color: #cbd5e1; }
    .status-track {
      display: flex;
      height: 8px;
      border-radius: 4px;
      overflow: hidden;
      background: #1a1a28;
    }
    .status-track .seg {
      height: 100%;
      min-width: 0;
      transition: width 0.3s ease;
    }
    .status-track .seg.loyalist { background: var(--loyal); }
    .status-track .seg.traitor { background: var(--traitor); }
    .status-track .seg.contested { background: var(--contested); }
    .status-track .seg.unaligned { background: var(--unaligned); }

    .map-wrap {
      flex: 1;
      position: relative;
      min-height: 0;
      background: radial-gradient(ellipse at center, #12121f 0%, #05050a 100%);
      overflow: hidden;
      touch-action: none;
      user-select: none;
    }
    #map {
      width: 100%;
      height: 100%;
      display: block;
    }
    .stars circle { fill: #fff; opacity: 0.35; }
    .link {
      stroke: #5a5a70;
      stroke-width: 2;
      fill: none;
    }
    .node { cursor: pointer; }
    .node circle.main {
      stroke-width: 3;
      transition: filter 0.15s;
    }
    .node.selected circle.main,
    .node:active circle.main {
      filter: drop-shadow(0 0 10px var(--accent));
    }

    /* Controller colours – fill + strong stroke */
    .node.loyalist circle.main {
      fill: var(--loyal-fill);
      stroke: var(--loyal);
    }
    .node.traitor circle.main {
      fill: var(--traitor-fill);
      stroke: var(--traitor);
    }
    .node.contested circle.main {
      fill: var(--contested-fill);
      stroke: var(--contested);
    }
    .node.unaligned circle.main {
      fill: var(--unaligned-fill);
      stroke: var(--unaligned);
    }

    .node text.type {
      font-size: 16px;
      font-weight: 700;
      fill: var(--text);
      text-anchor: middle;
      dominant-baseline: central;
      pointer-events: none;
    }
    .node text.label {
      font-size: 12px;
      fill: var(--text);
      text-anchor: middle;
      pointer-events: none;
    }
    .node text.sublabel {
      font-size: 10px;
      fill: var(--muted);
      text-anchor: middle;
      pointer-events: none;
    }
    .node text.garrison {
      pointer-events: none;
    }

    header .mode-slot {
      margin-left: auto;
      flex-shrink: 0;
    }

    .map-hint {
      position: absolute;
      bottom: 0.6rem;
      left: 50%;
      transform: translateX(-50%);
      font-size: 0.7rem;
      color: var(--muted);
      background: rgba(10,10,18,0.75);
      padding: 0.25rem 0.6rem;
      border-radius: 4px;
      pointer-events: none;
      opacity: 0.85;
      z-index: 5;
      transition: opacity 0.3s;
    }

    .sheet {
      position: fixed;
      left: 0;
      right: 0;
      bottom: 0;
      max-height: 55vh;
      background: var(--panel);
      border-top: 1px solid var(--border);
      border-radius: 16px 16px 0 0;
      padding: 0.75rem 1rem calc(1rem + var(--safe-bottom));
      z-index: 30;
      transform: translateY(100%);
      transition: transform 0.28s ease;
      display: flex;
      flex-direction: column;
      box-shadow: 0 -8px 24px rgba(0,0,0,0.45);
    }
    .sheet.open { transform: translateY(0); }
    .sheet-handle {
      width: 40px;
      height: 4px;
      background: var(--border);
      border-radius: 2px;
      margin: 0 auto 0.6rem;
      flex-shrink: 0;
    }
    .sheet h2 {
      font-size: 1.15rem;
      color: var(--accent);
      margin-bottom: 0.5rem;
      flex-shrink: 0;
    }
    .sheet-body {
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
      flex: 1;
    }
    .meta {
      display: grid;
      grid-template-columns: auto 1fr;
      gap: 0.3rem 0.75rem;
      font-size: 0.9rem;
      margin-bottom: 0.75rem;
    }
    .meta dt { color: var(--muted); }
    .meta dd { font-weight: 500; }
    .badge {
      display: inline-block;
      padding: 0.2rem 0.55rem;
      border-radius: 4px;
      font-size: 0.7rem;
      font-weight: 600;
      text-transform: uppercase;
    }
    .badge.loyalist { background: #1e3a5f; color: #93c5fd; }
    .badge.traitor { background: #5c1a1a; color: #fca5a5; }
    .badge.contested { background: #4a3b0a; color: #fde68a; }
    .badge.unaligned { background: #1e293b; color: #cbd5e1; }

    .forces { list-style: none; margin-bottom: 0.75rem; }
    .forces li {
      background: #1a1a28;
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 0.55rem 0.7rem;
      margin-bottom: 0.4rem;
      font-size: 0.85rem;
    }
    .forces .name { font-weight: 600; color: var(--accent); }
    .forces .detail { color: var(--muted); font-size: 0.8rem; margin-top: 0.15rem; }

    .actions {
      display: flex;
      flex-direction: column;
      gap: 0.45rem;
    }
    .actions .action-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 0.5rem;
    }
    .actions select,
    .actions input {
      width: 100%;
      background: #1a1a28;
      border: 1px solid var(--border);
      color: var(--text);
      padding: 0.45rem 0.55rem;
      border-radius: 8px;
      font-size: 0.85rem;
      font-family: inherit;
    }
    .actions button {
      background: #1e1e30;
      border: 1px solid var(--border);
      color: var(--text);
      padding: 0.7rem 0.5rem;
      border-radius: 8px;
      font-size: 0.9rem;
      font-weight: 500;
      cursor: pointer;
      min-height: 44px;
    }
    .action-note { font-size: 0.78rem; color: var(--muted); line-height: 1.35; }
    .action-note.ok { color: #86efac; }
    .action-note.err { color: #fca5a5; }
    .actions button:active {
      border-color: var(--accent);
      color: var(--accent);
      background: #252538;
    }

    .close-btn {
      position: absolute;
      top: 0.9rem;
      right: 1rem;
      background: none;
      border: none;
      color: var(--muted);
      font-size: 1.4rem;
      line-height: 1;
      padding: 0.2rem;
      cursor: pointer;
    }

    @media (min-width: 768px) {
      .map-hint { display: none; }
      .sheet {
        position: static;
        transform: none;
        max-height: none;
        width: 340px;
        border-radius: 0;
        border-top: none;
        border-left: 1px solid var(--border);
        box-shadow: none;
        padding: 1rem;
        flex-shrink: 0;
      }
      .sheet-handle, .close-btn { display: none; }
      .desktop-row {
        flex: 1;
        display: flex;
        min-height: 0;
      }
      .map-wrap { flex: 1; }
      header img { height: 44px; }
      header h1 { font-size: 1.2rem; }
      header .sub { font-size: 0.8rem; }
    }

    .key-bar {
      flex-shrink: 0;
      padding: 0.35rem 0.75rem;
      font-size: 0.68rem;
      color: var(--muted);
      background: #0e0e18;
      border-top: 1px solid var(--border);
      text-align: center;
      line-height: 1.5;
    }
    .key-bar .dot {
      display: inline-block;
      width: 10px;
      height: 10px;
      border-radius: 50%;
      vertical-align: middle;
      margin-right: 0.2rem;
      border: 2px solid;
    }
    .key-bar .dot.loyalist { background: var(--loyal-fill); border-color: var(--loyal); }
    .key-bar .dot.traitor { background: var(--traitor-fill); border-color: var(--traitor); }
    .key-bar .dot.contested { background: var(--contested-fill); border-color: var(--contested); }
    .key-bar .dot.unaligned { background: var(--unaligned-fill); border-color: var(--unaligned); }
    @media (min-width: 768px) {
      .key-bar { display: none; }
    }
  </style>
</head>
<body>
  <header>
    <div class="header-row">
      <img src="Sunset Heresy-ff-02.png" alt="Sunset Heresy" />
      <div class="titles">
        <h1>Sunset Heresy</h1>
        <div class="sub" id="header-sub">Port Maw</div>
      </div>
      <div id="mode-slot" class="mode-slot"></div>
    </div>
    <nav class="site-nav">
      <a href="index.html">Dashboard</a>
      <a href="campaign_map.html" class="active">Map</a>
      <a href="player_admin.html" data-role="campaign_admin">Players</a>
      <a href="forces.html">Forces</a>
      <a href="systems.html">Systems</a>
      <a href="games.html">Battles</a>
      <a href="rules.html">Rules</a>
      <span id="nav-auth"></span>
    </nav>
  </header>

  <div class="status-bar" id="status-bar">
    <div class="status-labels" id="status-labels"></div>
    <div class="status-track" id="status-track"></div>
  </div>

  <div class="desktop-row" style="flex:1;display:flex;min-height:0;">
    <div class="map-wrap" id="map-wrap">
      <svg id="map" viewBox="0 0 800 560" xmlns="http://www.w3.org/2000/svg">
        <g class="stars" id="stars"></g>
        <g id="links"></g>
        <g id="nodes"></g>
      </svg>
      <div class="map-hint" id="map-hint">Pinch to zoom · Drag to pan · Double-tap to reset</div>
    </div>

    <div class="sheet" id="sheet">
      <div class="sheet-handle"></div>
      <button class="close-btn" id="close-sheet" aria-label="Close">×</button>
      <h2 id="sheet-title">System</h2>
      <div class="sheet-body">
        <p class="empty" id="empty-msg" style="color:var(--muted);font-style:italic;font-size:0.9rem;">
          Tap a system on the map.
        </p>
        <div id="detail" hidden>
          <dl class="meta" id="meta"></dl>
          <h3 style="font-size:0.9rem;color:var(--muted);margin-bottom:0.4rem;">Forces present</h3>
          <ul class="forces" id="force-list"></ul>
          <div class="actions" id="action-buttons"></div>
        </div>
      </div>
    </div>
  </div>

  <div class="key-bar">
    <span class="dot loyalist"></span>Loyalist
    &nbsp;
    <span class="dot traitor"></span>Traitor
    &nbsp;
    <span class="dot contested"></span>Contested
    &nbsp;
    <span class="dot unaligned"></span>Neutral
  </div>

  <script src="js/api.js"></script>
  <script src="js/map.js"></script>
  <script>SH.applyNavPermissions();</script>
</body>
</html>
