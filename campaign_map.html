  <style>
html, body {
      height: 100%;
      overflow: hidden;

      -webkit-tap-highlight-color: transparent;
    }
    body {

      min-height: 0;}

    header {
      flex-shrink: 0;
      background: var(--chrome);
      border-bottom: 1px solid var(--border);
      z-index: 20;
    }
    header .header-row {
      display: flex;
      align-items: center;
      gap: var(--space-7);
      padding: var(--space-4) var(--space-10) var(--space-1);
    }
    header img { height: 36px; width: auto; flex-shrink: 0; }
    header .titles { flex: 1; min-width: 0; }
    header h1 {
      font-size: 1.05rem;
      font-weight: 600;
      letter-spacing: 0.03em;
      color: var(--accent);
      line-height: 1.2;
    }
    header .sub {
      font-size: 0.7rem;
      color: var(--muted);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    /* Control status bar */
    .status-bar {
      flex-shrink: 0;
      background: var(--chrome);
      border-bottom: 1px solid var(--border);
      padding: var(--space-4) var(--space-10) var(--space-6);
      z-index: 15;
    }
    .status-bar .status-labels {
      display: flex;
      justify-content: space-between;
      font-size: 0.68rem;
      margin-bottom: 0.3rem;
      gap: var(--space-3);
      flex-wrap: wrap;
    }
    .status-bar .status-labels span {
      display: flex;
      align-items: center;
      gap: var(--space-1);
      white-space: nowrap;
    }
    .status-bar .status-labels .pct {
      font-weight: 700;
      font-variant-numeric: tabular-nums;
    }
    .status-bar .status-labels .loyalist { color: var(--loyal-ink); }
    .status-bar .status-labels .traitor { color: var(--danger-ink); }
    .status-bar .status-labels .contested { color: var(--contested-ink); }
    .status-bar .status-labels .unaligned { color: var(--unaligned-ink); }
    .status-track {
      display: flex;
      height: 8px;
      border-radius: var(--radius-sm);
      overflow: hidden;
      background: var(--panel-2);
    }
    .status-track .seg {
      height: 100%;
      min-width: 0;
      transition: width 0.3s ease;
    }
    .status-track .seg.loyalist { background: var(--loyal); }
    .status-track .seg.traitor { background: var(--traitor); }
    .status-track .seg.contested { background: var(--contested); }
    .status-track .seg.unaligned { background: var(--unaligned); }

    .map-wrap {
      flex: 1;
      position: relative;
      min-height: 0;
      background: radial-gradient(ellipse at center, var(--map-glow) 0%, var(--map-void) 100%);
      overflow: hidden;
      touch-action: none;
      user-select: none;
    }
    #map {
      width: 100%;
      height: 100%;
      display: block;
    }
    .stars circle { fill: var(--star); opacity: 0.35; }
    .link {
      stroke: var(--map-link);
      stroke-width: 2;
      fill: none;
    }
    .node { cursor: pointer; }
    .node circle.main {
      stroke-width: 3;
      transition: filter 0.15s;
    }
    .node.selected circle.main,
    .node:active circle.main {
      filter: drop-shadow(0 0 10px var(--accent));
    }

    /* Controller colours – fill + strong stroke */
    .node.loyalist circle.main {
      fill: var(--loyal-fill);
      stroke: var(--loyal);
    }
    .node.traitor circle.main {
      fill: var(--traitor-fill);
      stroke: var(--traitor);
    }
    .node.contested circle.main {
      fill: var(--contested-fill);
      stroke: var(--contested);
    }
    .node.unaligned circle.main {
      fill: var(--unaligned-fill);
      stroke: var(--unaligned);
    }

    .node text.type {
      font-size: 16px;
      font-weight: 700;
      fill: var(--text);
      text-anchor: middle;
      dominant-baseline: central;
      pointer-events: none;
    }
    .node text.label {
      font-size: 12px;
      fill: var(--text);
      text-anchor: middle;
      pointer-events: none;
    }
    .node text.sublabel {
      font-size: 10px;
      fill: var(--muted);
      text-anchor: middle;
      pointer-events: none;
    }
    .node text.garrison {
      pointer-events: none;
    }

    header .mode-slot {
      margin-left: auto;
      flex-shrink: 0;
    }

    .map-hint {
      position: absolute;
      bottom: var(--space-7);
      left: 50%;
      transform: translateX(-50%);
      font-size: 0.7rem;
      color: var(--muted);
      background: var(--scrim);
      padding: var(--space-1) var(--space-7);
      border-radius: var(--radius-sm);
      pointer-events: none;
      opacity: 0.85;
      z-index: 5;
      transition: opacity 0.3s;
    }

    .sheet {
      position: fixed;
      left: 0;
      right: 0;
      bottom: 0;
      max-height: 55vh;
      background: var(--panel);
      border-top: 1px solid var(--border);
      border-radius: var(--radius-sheet) var(--radius-sheet) 0 0;
      padding: var(--space-10) var(--space-12) calc(var(--space-12) + var(--safe-bottom));
      z-index: 30;
      transform: translateY(100%);
      transition: transform 0.28s ease;
      display: flex;
      flex-direction: column;
      box-shadow: 0 -8px 24px var(--shadow);
    }
    .sheet.open { transform: translateY(0); }
    .sheet-handle {
      width: 40px;
      height: 4px;
      background: var(--border);
      border-radius: var(--radius-xs);
      margin: 0 auto var(--space-7);
      flex-shrink: 0;
    }
    .sheet h2 {
      font-size: 1.15rem;
      color: var(--accent);
      margin-bottom: var(--space-5);
      flex-shrink: 0;
    }
    .sheet-body {
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
      flex: 1;
    }
    .meta {
      display: grid;
      grid-template-columns: auto 1fr;
      gap: 0.3rem var(--space-10);
      font-size: 0.9rem;
      margin-bottom: var(--space-10);
    }
    .meta dt { color: var(--muted); }
    .meta dd { font-weight: 500; }
    .badge {

      padding: 0.2rem var(--space-6);

      font-size: 0.7rem;

      text-transform: uppercase;
    }
    .badge.loyalist {  color: var(--loyal-ink); }
    .badge.traitor {  color: var(--danger-ink); }
    .badge.contested { background: var(--contested-fill); color: var(--contested-ink); }
    .badge.unaligned { background: var(--unaligned-fill); color: var(--unaligned-ink); }

    .forces { list-style: none; margin-bottom: var(--space-10); }
    .forces li {
      background: var(--panel-2);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: var(--space-6) var(--space-9);
      margin-bottom: var(--space-3);
      font-size: 0.85rem;
    }
    .forces .name { font-weight: 600; color: var(--accent); }
    .forces .detail { color: var(--muted); font-size: 0.8rem; margin-top: 0.15rem; }
    .forces a.edit-details { display: inline-block; margin-top: var(--space-2); color: var(--accent); font-size: 0.85rem; font-weight: 600; }

    .actions {
      display: flex;
      flex-direction: column;
      gap: var(--space-4);
    }
    .actions .action-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: var(--space-5);
    }
    @media (min-width: 420px) {
      .actions .action-grid { grid-template-columns: 1fr 1fr; }
    }
    .actions select,
    .actions input {
      width: 100%;
      background: var(--panel-2);
      border: 1px solid var(--border);
      color: var(--text);
      padding: var(--space-4) var(--space-6);
      border-radius: var(--radius-md);
      font-size: 0.85rem;
      font-family: inherit;
    }
    .actions button {
      background: var(--control);
      border: 1px solid var(--border);
      color: var(--text);
      padding: var(--space-9) var(--space-5);
      border-radius: var(--radius-md);
      font-size: 0.9rem;
      font-weight: 500;
      cursor: pointer;
      min-height: var(--tap);
    }
    .action-note { font-size: 0.78rem; color: var(--muted); line-height: 1.35; }
    .action-note.ok { color: var(--success-ink); }
    .action-note.err { color: var(--danger-ink); }
    .actions button:active {
      border-color: var(--accent);
      color: var(--accent);
      background: var(--control-active);
    }
    .actions button:disabled {
      opacity: 0.45;
      cursor: not-allowed;
    }

    .close-btn {
      position: absolute;
      top: var(--space-4);
      right: var(--space-4);
      width: var(--tap);
      height: var(--tap);
      display: flex;
      align-items: center;
      justify-content: center;
      background: none;
      border: none;
      color: var(--muted);
      font-size: 1.5rem;
      line-height: 1;
      cursor: pointer;
    }

    @media (min-width: 768px) {
      .map-hint { display: none; }
      .sheet {
        position: static;
        transform: none;
        max-height: none;
        width: 340px;
        border-radius: 0;
        border-top: none;
        border-left: 1px solid var(--border);
        box-shadow: none;
        padding: var(--space-12);
        flex-shrink: 0;
      }
      .sheet-handle, .close-btn { display: none; }
      .desktop-row {
        flex: 1;
        display: flex;
        min-height: 0;
      }
      .map-wrap { flex: 1; }
      header img { height: var(--tap); }
      header h1 { font-size: 1.2rem; }
      header .sub { font-size: 0.8rem; }
    }

    .key-bar {
      flex-shrink: 0;
      padding: var(--space-2) var(--space-10);
      font-size: 0.68rem;
      color: var(--muted);
      background: var(--chrome);
      border-top: 1px solid var(--border);
      text-align: center;
      line-height: 1.5;
    }
    .key-bar .dot {
      display: inline-block;
      width: 10px;
      height: 10px;
      border-radius: 50%;
      vertical-align: middle;
      margin-right: 0.2rem;
      border: 2px solid;
    }
    .key-bar .dot.loyalist { background: var(--loyal-fill); border-color: var(--loyal); }
    .key-bar .dot.traitor { background: var(--traitor-fill); border-color: var(--traitor); }
    .key-bar .dot.contested { background: var(--contested-fill); border-color: var(--contested); }
    .key-bar .dot.unaligned { background: var(--unaligned-fill); border-color: var(--unaligned); }
    @media (min-width: 768px) {
      .key-bar { display: none; }
    }

    .site-header h1 { letter-spacing: 0.03em; }
  
  </style>
