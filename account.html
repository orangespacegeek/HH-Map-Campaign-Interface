<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#0e0e18" />
  <meta name="description" content="Edit your Sunset Heresy display name, contact, notes, and password." />
  <link rel="icon" href="Sunset%20Heresy-ff-02.png" type="image/png" />
  <link rel="apple-touch-icon" href="Sunset%20Heresy-ff-02.png" />
  <meta property="og:type" content="website" />
  <meta property="og:site_name" content="Sunset Heresy" />
  <meta property="og:title" content="Sunset Heresy – My account" />
  <meta property="og:description" content="Edit your Sunset Heresy display name, contact, notes, and password." />
  <meta property="og:image" content="__OG_IMAGE__" />
  <meta property="og:url" content="__OG_URL__" />
  <meta name="twitter:card" content="summary" />
  <meta name="twitter:title" content="Sunset Heresy – My account" />
  <meta name="twitter:description" content="Edit your Sunset Heresy display name, contact, notes, and password." />
  <meta name="twitter:image" content="__OG_IMAGE__" />
  <title>Sunset Heresy – My account</title>
  <style>
    :root {
      --bg: #0a0a12; --panel: #12121e; --panel-2: #1a1a28; --border: #3a3a55;
      --text: #e8e0c8; --muted: #9a9080; --accent: #f0c040; --danger: #ef4444;
      --safe-bottom: env(safe-area-inset-bottom, 0px);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { min-height: 100%; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; background: var(--bg); color: var(--text); }
    body { display: flex; flex-direction: column; min-height: 100vh; }
    main { flex: 1; width: 100%; max-width: 560px; margin: 0 auto; padding: 1.1rem 1rem calc(2rem + var(--safe-bottom)); }
    h2 { color: var(--accent); font-size: 1.2rem; margin-bottom: 0.35rem; }
    .lead { color: var(--muted); font-size: 0.88rem; line-height: 1.45; margin-bottom: 1rem; }
    .card { background: var(--panel); border: 1px solid var(--border); border-radius: 12px; padding: 1rem; margin-bottom: 1rem; }
    .card h3 { font-size: 0.95rem; margin-bottom: 0.75rem; }
    .form-group { margin-bottom: 0.8rem; }
    label { display: block; font-size: 0.72rem; color: var(--muted); text-transform: uppercase; letter-spacing: 0.04em; margin-bottom: 0.3rem; }
    input, textarea {
      width: 100%; background: var(--panel-2); border: 1px solid var(--border); color: var(--text);
      padding: 0.65rem 0.75rem; border-radius: 8px; font-size: 16px; font-family: inherit;
    }
    textarea { min-height: 88px; resize: vertical; }
    input:focus, textarea:focus { outline: none; border-color: var(--accent); }
    button {
      width: 100%; appearance: none; border: none; background: var(--accent); color: #0a0a12;
      font-weight: 600; padding: 0.7rem; border-radius: 8px; font-size: 0.95rem; cursor: pointer;
    }
    .msg { margin-top: 0.7rem; padding: 0.55rem 0.7rem; border-radius: 8px; font-size: 0.85rem; display: none; }
    .msg.error { display: block; background: #3f1515; color: #fca5a5; border: 1px solid var(--danger); }
    .msg.ok { display: block; background: #14532d; color: #86efac; border: 1px solid #22c55e; }
    .who { font-size: 0.85rem; color: var(--muted); margin-bottom: 0.8rem; line-height: 1.4; }
    a { color: var(--accent); }
  </style>
  <link rel="stylesheet" href="css/site-nav.css" />
</head>
<body>
  <header class="site-header">
  <div class="site-header-inner">
    <button type="button" class="nav-toggle" aria-expanded="false" aria-controls="site-menu" aria-label="Open menu">
      <span class="nav-toggle-bar"></span>
      <span class="nav-toggle-bar"></span>
      <span class="nav-toggle-bar"></span>
    </button>
    <a class="brand" href="index.html">
      <img src="Sunset Heresy-ff-02.png" alt="" width="36" height="36" />
      <span class="titles">
        <span class="brand-kicker">Sunset Heresy</span>
        <h1>My account</h1>
        <span class="sub" id="header-sub">Name, contact, password</span>
      </span>
    </a>
    <div class="header-end">
      <a id="nav-waiting" href="actions.html" hidden>Actions</a>
      <span id="nav-auth"></span>
    </div>
  </div>
  <nav class="site-nav" id="site-menu">
    <a href="index.html">Dashboard</a>
    <a href="campaign_map.html">Map</a>
    <a href="player_admin.html" data-role="campaign_admin">Players</a>
    <a href="forces.html">Forces</a>
    <a href="systems.html">Systems</a>
    <a href="games.html">Battles</a>
    <a href="rules.html">Rules</a>
    <button type="button" id="nav-logout" hidden>Log out</button>
    <div id="mode-slot" class="mode-slot"></div>
  </nav>
</header>
  <main>
    <h2>My account</h2>
    <p class="lead" id="lead">Sign in to edit the name other players see, your contact, and your password.</p>
    <div id="signed-out" class="card" hidden>
      <p>You are viewing as a guest. <a href="login.html">Log in</a> to edit your account.</p>
    </div>
    <div id="profile-card" class="card" hidden>
      <h3>Profile</h3>
      <p class="who" id="who"></p>
      <form id="profile-form">
        <div class="form-group">
          <label for="display_name">Display name</label>
          <input id="display_name" maxlength="80" required autocomplete="nickname" />
        </div>
        <div class="form-group">
          <label for="contact">Contact</label>
          <input id="contact" maxlength="120" autocomplete="off" placeholder="Discord name, email, or leave blank" />
        </div>
        <div class="form-group">
          <label for="notes">Notes</label>
          <textarea id="notes" maxlength="500" placeholder="When you can play, list preferences…"></textarea>
        </div>
        <button type="submit">Save profile</button>
        <div class="msg" id="profile-msg"></div>
      </form>
    </div>
    <div id="password-card" class="card" hidden>
      <h3>Password</h3>
      <form id="password-form">
        <div class="form-group">
          <label for="current_password">Current password</label>
          <input id="current_password" type="password" autocomplete="current-password" required />
        </div>
        <div class="form-group">
          <label for="password">New password</label>
          <input id="password" type="password" minlength="6" maxlength="128" autocomplete="new-password" required />
        </div>
        <button type="submit">Change password</button>
        <div class="msg" id="password-msg"></div>
      </form>
    </div>
  </main>
  <script src="js/api.js"></script>
  <script>
    function showMsg(id, kind, text) {
      const el = document.getElementById(id);
      el.className = "msg " + kind;
      el.textContent = text;
    }

    document.getElementById("profile-form").addEventListener("submit", async (e) => {
      e.preventDefault();
      const me = SH.user;
      if (!me || !me.player) return;
      try {
        await SH.save("players", {
          player_id: me.player.player_id,
          display_name: document.getElementById("display_name").value.trim(),
          contact: document.getElementById("contact").value.trim(),
          notes: document.getElementById("notes").value.trim()
        });
        await SH.me();
        await SH.applyNavPermissions();
        showMsg("profile-msg", "ok", "Profile saved.");
      } catch (err) {
        showMsg("profile-msg", "error", err.message || "Could not save");
      }
    });

    document.getElementById("password-form").addEventListener("submit", async (e) => {
      e.preventDefault();
      try {
        await SH.setPassword({
          current_password: document.getElementById("current_password").value,
          password: document.getElementById("password").value
        });
        document.getElementById("password-form").reset();
        showMsg("password-msg", "ok", "Password changed.");
      } catch (err) {
        showMsg("password-msg", "error", err.message || "Could not change password");
      }
    });

    (async () => {
      await SH.probe();
      await SH.applyNavPermissions();
      if (!SH.isLoggedIn()) {
        document.getElementById("signed-out").hidden = false;
        return;
      }
      const me = SH.user;
      document.getElementById("password-card").hidden = false;
      document.getElementById("lead").textContent = "Update how you appear in the campaign, and change the password you use to sign in.";
      if (me.player) {
        document.getElementById("profile-card").hidden = false;
        document.getElementById("who").textContent =
          "Signed in as " + (me.login || me.label || "your account") +
          (me.player.allegiance ? " · " + me.player.allegiance : "");
        document.getElementById("display_name").value = me.player.display_name || "";
        document.getElementById("contact").value = me.player.contact || "";
        document.getElementById("notes").value = me.player.notes || "";
      } else {
        document.getElementById("lead").textContent = "This login is not tied to a player record, so there is no display name to edit. You can still change the password.";
      }
    })();
  </script>
</body>
</html>
